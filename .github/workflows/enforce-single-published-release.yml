name: Enforce Single-Published Release Per Product

# Inviolable invariant: only ONE Published release per product
# (ntttool / zing / vmar / vmip) at any time. The edge-api
# `/v2/updates/active` GitHub fallback picks the newest non-draft
# non-prerelease matching a product prefix; stale Published releases
# pollute the listing and break "single source of truth" guarantees.
#
# This workflow fires whenever a release is published — by gh CLI,
# the GitHub UI, the API, or any build script — and demotes every
# OTHER previously-Published release of the same product to Draft.
# That makes the rule un-bypassable: local scripts can skip the
# demote step but this server-side hook cannot.

on:
  release:
    # `published` fires when draft=false (UI publish or `gh release create`).
    # `released` fires only for non-pre-release published events.
    # `created` covers `gh release create` paths some report as not firing
    # `published` (API direct, automation tools). The job logic is idempotent
    # and bails out if the release that triggered it isn't actually Published,
    # so duplicate firings are safe.
    types: [published, released, created]
  # Allow manual replay against an existing tag — used for backfill
  # sweeps and for testing the demote logic without creating a fresh
  # release. Pass tag_name as input; logic mirrors the release event.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to enforce against (e.g. vmar-v2026.5.9.30)"
        required: true
        type: string

permissions:
  contents: write   # PATCH /releases/:id requires repo write

jobs:
  demote-other-published:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag (release event vs manual dispatch)
        id: target
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          REPO:        ${{ github.repository }}
          EVENT_NAME:  ${{ github.event_name }}
          REL_TAG:     ${{ github.event.release.tag_name }}
          REL_ID:      ${{ github.event.release.id }}
          MANUAL_TAG:  ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$REL_TAG"
            ID="$REL_ID"
          else
            TAG="$MANUAL_TAG"
            # Resolve id from tag for manual dispatch
            ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)
          fi
          # Idempotency guard: when both `published` and `created` fire for
          # the same release, this job runs twice. The second run only does
          # work if it sees the triggering release as still Published — which
          # it should, but we re-check authoritative state from the API rather
          # than trusting the event payload (which can be stale on retry).
          DRAFT=$(gh api "repos/$REPO/releases/$ID" --jq .draft)
          if [[ "$DRAFT" != "false" ]]; then
            echo "Triggering release '$TAG' is currently draft=$DRAFT — nothing to enforce, exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$ID"   >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG id=$ID (Published)"

      - name: Demote stale Published releases for the same product
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG:  ${{ steps.target.outputs.tag }}
          NEW_ID:   ${{ steps.target.outputs.id }}
          REPO:     ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "::group::Resolving product from tag '$NEW_TAG'"

          # tag_prefix → product. Same map as edge-api loadFromGitHub
          # (v3/edge-api/src/routes/client/updates.ts:101-106). When a
          # new product gets added, update BOTH places.
          declare -A PREFIXES=(
            [ntttool-v]=ntttool
            [nttool-v]=ntttool
            [zing-v]=zing
            [zingtools-v]=zing
            [vmar-v]=vmar
            [mumuaccountrunner-v]=vmar
            [vmip-v]=vmip
          )

          PRODUCT=""
          MATCHED_PREFIX=""
          for prefix in "${!PREFIXES[@]}"; do
            if [[ "${NEW_TAG,,}" == ${prefix,,}* ]]; then
              PRODUCT="${PREFIXES[$prefix]}"
              MATCHED_PREFIX="$prefix"
              break
            fi
          done

          if [[ -z "$PRODUCT" ]]; then
            echo "Tag '$NEW_TAG' does not match any known product prefix — nothing to enforce."
            exit 0
          fi
          echo "Product: $PRODUCT (matched prefix: $MATCHED_PREFIX)"
          echo "::endgroup::"

          echo "::group::Collecting all valid prefixes for product '$PRODUCT'"
          # Reverse map: every prefix that maps to this product. A vmar
          # release tagged `mumuaccountrunner-v...` must demote a
          # later-tagged `vmar-v...` and vice versa.
          PRODUCT_PREFIXES=()
          for prefix in "${!PREFIXES[@]}"; do
            if [[ "${PREFIXES[$prefix]}" == "$PRODUCT" ]]; then
              PRODUCT_PREFIXES+=("$prefix")
            fi
          done
          echo "Prefixes: ${PRODUCT_PREFIXES[*]}"
          echo "::endgroup::"

          echo "::group::Listing currently Published releases for product '$PRODUCT'"
          # Pull every Published release (paginated) and filter to ones
          # whose tag starts with one of this product's prefixes AND
          # isn't the release that just triggered this workflow.
          # Build a jq `or` chain dynamically — simpler + more debuggable
          # than passing an array variable into the jq stream context.
          PREFIX_FILTER=""
          for p in "${PRODUCT_PREFIXES[@]}"; do
            p_lower=$(echo "$p" | tr '[:upper:]' '[:lower:]')
            if [[ -z "$PREFIX_FILTER" ]]; then
              PREFIX_FILTER="startswith(\"$p_lower\")"
            else
              PREFIX_FILTER="$PREFIX_FILTER or startswith(\"$p_lower\")"
            fi
          done
          echo "jq prefix filter: $PREFIX_FILTER"
          STALE=$(gh api "repos/$REPO/releases" --paginate --jq "
            [ .[]
              | select(.draft == false)
              | select(.id != $NEW_ID)
              | select(.tag_name | ascii_downcase | ($PREFIX_FILTER))
              | {id, tag_name}
            ]
          ")
          STALE_COUNT=$(echo "$STALE" | jq 'length')
          echo "Found $STALE_COUNT stale Published release(s)"
          echo "$STALE" | jq -r '.[] | "  - \(.tag_name) (id=\(.id))"'
          echo "::endgroup::"

          if [[ "$STALE_COUNT" -eq 0 ]]; then
            echo "Invariant already satisfied — no action needed."
            exit 0
          fi

          echo "::group::Demoting stale releases to Draft"
          echo "$STALE" | jq -r '.[] | "\(.id) \(.tag_name)"' | while read -r id tag; do
            echo "Demoting $tag (id=$id) → draft=true"
            # `-F` (uppercase) sends typed JSON (bool true), unlike `-f` which
            # would send the string "true" — and GitHub silently ignores a
            # string in a boolean field, leaving the release Published.
            gh api -X PATCH "repos/$REPO/releases/$id" -F draft=true >/dev/null
          done
          echo "::endgroup::"

          echo "::notice title=Single-Published Invariant::Demoted $STALE_COUNT stale $PRODUCT release(s); kept $NEW_TAG as the sole Published."
